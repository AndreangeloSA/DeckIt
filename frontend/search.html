<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2e5cf">
  <title>DeckIt — Pesquisar cartas</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/search.css">
</head>
<body>
<a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
  <div class="app">
    <header class="header">
      <div class="brand"><img src="assets/logo/deckit-contorno.png" width="2172" height="724" alt="DeckIt"></div>

    </header>
    <main id="conteudo" class="main search-page">
      <header class="search-heading">
        <h1>Pesquisar cartas</h1>
        <p>Encontre uma carta para sua coleção.</p>
      </header>
      <form class="card-search-form" action="search.html" method="get">
        <label class="sr-only" for="card-query">Nome da carta</label>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="10.8" cy="10.8" r="7.7"/><path d="m16.5 16.5 5 5"/></svg>
        <input id="card-query" name="q" type="search" placeholder="Nome da carta..." autocomplete="off" required>
        <button type="submit">Buscar</button>
      </form>
      <section class="search-results" aria-labelledby="results-title">
        <div class="results-heading"><h2 id="results-title">Resultados</h2><span>3 cartas</span></div>
        <ul class="search-card-grid">
          <li><figure class="search-card"><img src="assets/cards/46986414.jpg" alt="Dark Magician" width="421" height="614"><figcaption>Dark Magician</figcaption></figure></li>
          <li><figure class="search-card"><img src="assets/cards/89631139.jpg" alt="Blue-Eyes White Dragon" width="421" height="614"><figcaption>Blue-Eyes White Dragon</figcaption></figure></li>
          <li><figure class="search-card"><img src="assets/cards/74677422.jpg" alt="Red-Eyes Black Dragon" width="421" height="614"><figcaption>Red-Eyes Black Dragon</figcaption></figure></li>
        </ul>
      </section>
    </main>
    <footer class="site-footer">
      <p><strong>DeckIt.</strong> <span lang="en">Developed by</span> <span class="author">Andreângelo S. Andrade</span> / <a class="repository-link" href="https://github.com/AndreangeloSA/DeckIt">github.com/AndreangeloSA/DeckIt</a></p>
    </footer>
    <nav class="bottom-nav" aria-label="Navegação principal">
      <a class="nav-item" href="index.html"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m2 10 10-8 10 8M4 9v12h6v-7h4v7h6V9"/></svg><span>Início</span></a>
      <a class="nav-item" href="decks.html"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="3" width="12" height="17" rx="2" transform="rotate(12 14 12)"/><path d="m6 7-3 1 3 14 10-1"/></svg><span>Decks</span></a>
      <a class="nav-item active" href="search.html" aria-current="page"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.8" cy="10.8" r="7.7"/><path d="m16.5 16.5 5 5"/></svg><span>Cartas</span></a>
      <a class="nav-item" href="account.html"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="9" r="3"/><path d="M5 19c1-6 13-6 14 0"/></svg><span>Perfil</span></a>
      <a class="nav-item" href="settings.html" aria-label="Configurações"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 2h5l.6 3a8 8 0 0 1 1.3.8l2.9-1 2.5 4.4-2.3 2a8 8 0 0 1 0 1.6l2.3 2-2.5 4.4-2.9-1a8 8 0 0 1-1.3.8l-.6 3h-5l-.6-3a8 8 0 0 1-1.3-.8l-2.9 1-2.5-4.4 2.3-2a8 8 0 0 1 0-1.6l-2.3-2 2.5-4.4 2.9 1A8 8 0 0 1 8.9 5Z"/><circle cx="12" cy="12" r="3.5"/></svg><span>Ajustes</span></a>
    </nav>
  </div>
</body>
</html>
